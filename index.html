<!DOCTYPE html>
<html lang="ja">
<head>

<title>N トータルビューティサロン</title>

<style>

    background:white;
}

    box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.card a{
    text-decoration:none;
    color:#c49a6c;

}

footer{

    padding:30px;
}
</style>

<header>

</p>

</header>

<div class="menu">

</div>

<div class="card">

</div>

</footer>

</body>
</html>
